<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Planner ✈️🌸</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #cbd5e1; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
      cursor: pointer;
    }
  </style>
</head>
<body class="flex justify-center min-h-screen">

  <div id="app-container" class="w-full max-w-md bg-[#b6e1f4] min-h-screen shadow-2xl flex flex-col relative pb-24">
    
    <!-- ✈️ Header -->
    <div class="bg-[#7aa2ce] text-white p-6 rounded-b-[2.5rem] shadow-md z-10">
      <div class="flex justify-between items-start">
        <div class="flex-1 pr-2">
          <span class="bg-[#9abde1] text-white text-[11px] px-3 py-1 rounded-full font-medium shadow-sm">
            🇯🇵 ทริปต่างประเทศ
          </span>
          
          <h1 contenteditable="true" class="text-2xl font-bold mt-2 tracking-wide outline-none hover:bg-white/10 focus:bg-white/20 rounded-lg px-1 transition cursor-pointer" title="กดเพื่อแก้ไขชื่อทริป">
            Shanghai 2026 🌸
          </h1>
          
          <div class="mt-2 space-y-1">
            <div class="flex items-center gap-1.5">
              <span class="text-xs text-white/90 font-medium">📅 เริ่มวันแรก:</span>
              <input type="date" id="start-date-picker" onchange="onStartDateChange(this.value)" class="bg-white/20 text-white text-xs font-bold rounded-lg px-2 py-1 border border-white/30 outline-none cursor-pointer hover:bg-white/30 transition">
            </div>
            <p id="date-range-display" class="text-[11px] text-white/90 font-medium pl-1"></p>
          </div>
        </div>

        <div onclick="copyRoomCode()" class="bg-white/20 backdrop-blur-sm px-3 py-2 rounded-xl text-center border border-white/30 cursor-pointer hover:bg-white/30 active:scale-95 transition shadow-sm shrink-0" title="กดเพื่อคัดลอกรหัสห้อง">
          <p class="text-[9px] text-white/90 tracking-wider">ROOM CODE 🔑</p>
          <p class="font-mono text-sm font-bold text-[#fceb9e]" id="room-code-text">OSAKA88</p>
        </div>
      </div>
    </div>

    <!-- 🏷️ Navigation Tabs -->
    <div class="flex bg-white mx-4 mt-[-18px] pt-5 pb-2 px-2 rounded-2xl shadow-sm z-0 text-sm font-medium">
      <button onclick="switchTab(1)" id="tab-btn-1" class="flex-1 py-2 text-[#7aa2ce] border-b-2 border-[#7aa2ce] font-bold transition-all">
        📍 แผนเที่ยว
      </button>
      <button onclick="switchTab(2)" id="tab-btn-2" class="flex-1 py-2 text-gray-400 hover:text-[#7aa2ce] transition-all">
        💸 ค่าใช้จ่าย
      </button>
      <button onclick="switchTab(3)" id="tab-btn-3" class="flex-1 py-2 text-gray-400 hover:text-[#7aa2ce] transition-all">
        📁 เอกสาร
      </button>
    </div>

    <!-- ------------------------------------------------ -->
    <!-- 📍 TAB 1: แผนท่องเที่ยว -->
    <!-- ------------------------------------------------ -->
    <div id="tab-1" class="flex-1 overflow-y-auto px-4 py-4 space-y-4">
      <div class="flex gap-2 overflow-x-auto scrollbar-hide items-center py-1" id="day-buttons"></div>
      <div class="space-y-3" id="itinerary-list"></div>
      <button onclick="addTimeSlot()" class="w-full py-3 bg-[#fceb9e] text-gray-800 font-bold text-sm rounded-2xl shadow-sm hover:bg-[#f5e69e] active:scale-95 transition-all flex justify-center items-center gap-2">
        ➕ เพิ่มเวลา / สถานที่
      </button>
    </div>

    <!-- ------------------------------------------------ -->
    <!-- 💸 TAB 2: ค่าใช้จ่าย -->
    <!-- ------------------------------------------------ -->
    <div id="tab-2" class="hidden flex-1 overflow-y-auto px-4 py-4 space-y-4">
      <div class="bg-white p-4 rounded-2xl shadow-sm space-y-3">
        <div class="flex items-center justify-between bg-gray-50 p-2.5 rounded-xl border border-gray-100">
          <span class="text-xs font-bold text-gray-700">👥 จำนวนผู้เดินทาง:</span>
          <div class="flex items-center gap-2">
            <input type="number" id="traveler-count" value="3" min="1" onchange="updateTravelerCount(this.value)" oninput="updateTravelerCount(this.value)" class="w-16 p-1.5 bg-white border border-gray-200 text-center font-bold text-xs rounded-lg outline-none text-[#7aa2ce] focus:border-[#7aa2ce]">
            <span class="text-xs text-gray-500 font-medium">คน</span>
          </div>
        </div>

        <div class="pt-2 border-t border-gray-100 grid grid-cols-2 gap-2">
          <div class="bg-[#b6e1f4]/30 p-3 rounded-xl text-center">
            <p class="text-[10px] text-gray-500 font-semibold">ยอดรวมทั้งหมด 💰</p>
            <h2 class="text-lg font-bold text-[#7aa2ce] mt-0.5" id="total-expense">฿ 0</h2>
          </div>
          <div class="bg-[#fceb9e]/50 p-3 rounded-xl text-center">
            <p class="text-[10px] text-gray-600 font-semibold">เฉลี่ยคนละ 🙋‍♂️</p>
            <h2 class="text-lg font-bold text-gray-800 mt-0.5" id="per-person-expense">฿ 0</h2>
          </div>
        </div>
      </div>

      <div class="bg-white p-4 rounded-2xl shadow-sm space-y-3">
        <h3 class="font-bold text-gray-700 text-sm">บันทึกค่าใช้จ่ายใหม่ 📝</h3>
        <input type="text" id="exp-title" placeholder="รายการ (เช่น ค่าโรงแรม, ค่าซูชิ)" class="w-full p-2.5 bg-gray-50 border border-gray-200 text-xs rounded-xl outline-none focus:border-[#7aa2ce]">
        <input type="number" id="exp-amount" placeholder="จำนวนเงิน (บาท)" class="w-full p-2.5 bg-gray-50 border border-gray-200 text-xs rounded-xl outline-none focus:border-[#7aa2ce]">
        
        <button onclick="addExpense()" class="w-full py-2.5 bg-[#7aa2ce] text-white font-bold text-xs rounded-xl shadow-sm hover:bg-[#6894c2] active:scale-95 transition-all">
          + บันทึกรายการ
        </button>
      </div>

      <div class="space-y-2" id="expense-items-list"></div>
    </div>

    <!-- ------------------------------------------------ -->
    <!-- 📁 TAB 3: เอกสาร & เช็กลิสต์ -->
    <!-- ------------------------------------------------ -->
    <div id="tab-3" class="hidden flex-1 overflow-y-auto px-4 py-4 space-y-4">
      <div class="bg-white p-4 rounded-2xl shadow-sm">
        <h3 class="font-bold text-gray-700 text-sm mb-3">สิ่งของที่ต้องเตรียม 🎒</h3>
        <div class="space-y-2" id="checklist-container"></div>
        <div class="flex gap-2 mt-4 pt-3 border-t border-gray-100">
          <input type="text" id="new-check-item" placeholder="เพิ่มรายการสิ่งของ..." class="flex-1 p-2.5 bg-gray-50 border border-gray-200 text-xs rounded-xl outline-none focus:border-[#7aa2ce]">
          <button onclick="addChecklistItem()" class="px-4 py-2.5 bg-[#7aa2ce] text-white font-bold text-xs rounded-xl hover:bg-[#6894c2] active:scale-95 transition-all">
            + เพิ่ม
          </button>
        </div>
      </div>

      <div class="bg-white p-4 rounded-2xl shadow-sm">
        <div class="flex justify-between items-center mb-3">
          <h3 class="font-bold text-gray-700 text-sm">คลังเอกสารสำคัญ 📎</h3>
          <label class="text-xs bg-[#7aa2ce] text-white px-3 py-1.5 rounded-xl font-bold cursor-pointer hover:bg-[#6894c2] transition">
            + อัปโหลด
            <input type="file" accept="image/*" class="hidden" onchange="uploadDoc(event)">
          </label>
        </div>
        <div class="grid grid-cols-2 gap-3" id="doc-grid"></div>
      </div>
    </div>

    <!-- 🖼️ Pop-up ดูเอกสาร / กดค้างบันทึกรูป -->
    <div id="doc-modal" class="fixed inset-0 bg-black/80 z-50 hidden flex flex-col items-center justify-center p-4 backdrop-blur-sm" onclick="closeDocModal()">
      <div class="relative max-w-full max-h-[85vh] flex flex-col items-center" onclick="event.stopPropagation()">
        <!-- ปุ่มปิด Pop-up -->
        <button onclick="closeDocModal()" class="absolute -top-12 right-0 text-white font-bold text-lg bg-white/20 hover:bg-white/40 w-9 h-9 rounded-full flex items-center justify-center transition">✕</button>
        
        <!-- แท็กรูปภาพ (แตะค้างบนมือถือเพื่อเซฟรูปได้) -->
        <img id="modal-img" src="" class="max-w-full max-h-[70vh] object-contain rounded-2xl shadow-2xl border-2 border-white/20">
        
        <!-- ชื่อไฟล์ & คำแนะนำ -->
        <p id="modal-filename" class="text-white text-xs font-semibold mt-3 bg-white/20 px-3 py-1 rounded-full backdrop-blur-md"></p>
        <p class="text-white/80 text-[11px] mt-2 bg-black/40 px-3 py-1 rounded-full">💡 กดค้างที่รูปภาพเพื่อบันทึกลงเครื่อง</p>
      </div>
    </div>

    <!-- 📸 Export Button -->
    <div class="fixed bottom-3 left-0 w-full px-6 flex justify-center z-20 pointer-events-none">
      <button onclick="exportToImage()" class="pointer-events-auto bg-[#7aa2ce] text-white shadow-xl px-6 py-3 rounded-full font-bold text-xs flex items-center gap-2 hover:scale-105 active:scale-95 transition-transform border-2 border-white">
        📸 แคปเจอร์หน้าจอนี้
      </button>
    </div>

  </div>

  <script>
    let activeTab = 1;
    let activeDay = 1;
    let totalDays = 4;
    let startDate = "2026-12-03";
    let travelerCount = 3;

    const monthsEN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

    let itineraryData = {
      1: [
        { id: 1, time: '08:00', detail: '🛬 ถึงสนามบินคันไซ (KIX) ผ่าน ตม.' },
        { id: 2, time: '10:30', detail: '🏨 ฝากกระเป๋าที่โรงแรม ย่าน Namba' },
        { id: 3, time: '12:00', detail: '🍜 ทานราเมงข้อสอบ Ichiran' }
      ],
      2: [{ id: 4, time: '09:00', detail: '🎢 Universal Studios Japan (USJ)' }],
      3: [],
      4: []
    };

    let expenses = [
      { id: 1, title: 'โรงแรม 2 คืน 🏨', amount: 6000 },
      { id: 2, title: 'ค่าซูชิสายพาน 🍣', amount: 1500 }
    ];

    let checklist = [
      { id: 1, text: 'หนังสือเดินทาง (Passport) 🛂', done: true },
      { id: 2, text: 'แลกเงินเยน (Yen) 💴', done: true },
      { id: 3, text: 'ซื้อ Travel eSIM 📱', done: false }
    ];

    let documents = [
      { id: 1, name: 'IMG_0887.jpeg', icon: '📄', src: '' }
    ];

    // --- Date Calculation Helper ---
    function getDateForDay(dayIndex) {
      if (!startDate) return '';
      const d = new Date(startDate);
      d.setDate(d.getDate() + (dayIndex - 1));
      return `${d.getDate()} ${monthsEN[d.getMonth()]}`;
    }

    function updateHeaderDateRange() {
      if (!startDate) return;
      const start = new Date(startDate);
      const end = new Date(startDate);
      end.setDate(end.getDate() + (totalDays - 1));

      const startStr = `${start.getDate()} ${monthsEN[start.getMonth()]}`;
      const endStr = `${end.getDate()} ${monthsEN[end.getMonth()]} ${end.getFullYear()}`;
      
      document.getElementById('date-range-display').innerText = `🗓️ ${startStr} - ${endStr} (${totalDays} วัน)`;
    }

    function onStartDateChange(val) {
      startDate = val;
      updateHeaderDateRange();
      renderDays();
    }

    function copyRoomCode() {
      const code = document.getElementById('room-code-text').innerText;
      navigator.clipboard.writeText(code).then(() => {
        alert(`คัดลอกรหัสห้อง [ ${code} ] เรียบร้อยแล้ว! 🔑`);
      }).catch(() => {
        alert(`รหัสห้องคือ: ${code}`);
      });
    }

    function switchTab(id) {
      activeTab = id;
      [1, 2, 3].forEach(i => {
        document.getElementById(`tab-${i}`).classList.add('hidden');
        document.getElementById(`tab-btn-${i}`).className = "flex-1 py-2 text-gray-400 hover:text-[#7aa2ce] transition-all";
      });
      document.getElementById(`tab-${id}`).classList.remove('hidden');
      document.getElementById(`tab-btn-${id}`).className = "flex-1 py-2 text-[#7aa2ce] border-b-2 border-[#7aa2ce] font-bold transition-all";
    }

    // --- Tab 1 Logic ---
    function renderDays() {
      const dayBox = document.getElementById('day-buttons');
      let html = '';
      for (let day = 1; day <= totalDays; day++) {
        const isActive = day === activeDay;
        const dayDateStr = getDateForDay(day);
        html += `
          <button onclick="changeDay(${day})" class="min-w-[80px] py-2 rounded-2xl text-xs font-bold transition-all flex flex-col items-center justify-center ${
            isActive ? 'bg-[#fceb9e] text-gray-800 shadow-sm' : 'bg-[#9abde1] text-white opacity-80 hover:opacity-100'
          }">
            <span>Day ${day} 🌸</span>
            <span class="text-[10px] font-normal ${isActive ? 'text-gray-700' : 'text-white/90'}">${dayDateStr}</span>
          </button>
        `;
      }
      html += `
        <button onclick="addNewDay()" class="min-w-[35px] h-[35px] rounded-full bg-white text-[#7aa2ce] font-bold text-sm shadow-sm hover:bg-gray-50 flex items-center justify-center shrink-0">
          +
        </button>
      `;
      dayBox.innerHTML = html;
    }

    function changeDay(day) {
      activeDay = day;
      renderDays();
      renderItinerary();
    }

    function addNewDay() {
      totalDays++;
      itineraryData[totalDays] = [];
      updateHeaderDateRange();
      changeDay(totalDays);
    }

    function renderItinerary() {
      const itemList = document.getElementById('itinerary-list');
      const items = itineraryData[activeDay] || [];
      if (items.length === 0) {
        itemList.innerHTML = `<div class="text-center py-8 text-xs text-gray-500 bg-white/50 rounded-2xl">ยังไม่มีแผนสำหรับวันนี้ กดปุ่มด้านล่างเพื่อเพิ่มได้เลย ✨</div>`;
        return;
      }
      itemList.innerHTML = items.map((item, index) => `
        <div class="flex items-start gap-2 bg-white p-3 rounded-2xl shadow-sm border-l-4 border-[#7aa2ce]">
          <input type="time" value="${item.time}" onchange="updateTimeSlot(${index}, 'time', this.value)" class="bg-gray-50 border border-gray-200 text-[#7aa2ce] font-bold text-xs rounded-xl p-2 outline-none w-20 text-center">
          <textarea rows="2" oninput="updateTimeSlot(${index}, 'detail', this.value)" class="w-full bg-transparent text-xs text-gray-700 outline-none resize-none pt-1" placeholder="พิมพ์กิจกรรม...">${item.detail}</textarea>
          <button onclick="removeTimeSlot(${index})" class="text-gray-300 hover:text-red-500 font-bold px-1 text-xs pt-1">✕</button>
        </div>
      `).join('');
    }

    function addTimeSlot() {
      if (!itineraryData[activeDay]) itineraryData[activeDay] = [];
      itineraryData[activeDay].push({ id: Date.now(), time: '12:00', detail: '' });
      renderItinerary();
    }

    function updateTimeSlot(index, field, value) {
      if (itineraryData[activeDay] && itineraryData[activeDay][index]) {
        itineraryData[activeDay][index][field] = value;
      }
    }

    function removeTimeSlot(index) {
      itineraryData[activeDay].splice(index, 1);
      renderItinerary();
    }

    // --- Tab 2 Expense Logic ---
    function updateTravelerCount(val) {
      travelerCount = parseInt(val) || 1;
      if (travelerCount < 1) travelerCount = 1;
      renderExpenses();
    }

    function renderExpenses() {
      const list = document.getElementById('expense-items-list');
      let total = 0;

      expenses.forEach(e => {
        total += e.amount;
      });

      const perPerson = travelerCount > 0 ? total / travelerCount : 0;

      document.getElementById('total-expense').innerText = `฿ ${total.toLocaleString()}`;
      document.getElementById('per-person-expense').innerText = `฿ ${Math.round(perPerson).toLocaleString()}`;

      list.innerHTML = expenses.map((e, index) => `
        <div class="bg-white p-3 rounded-2xl shadow-sm flex justify-between items-center text-xs">
          <span class="font-bold text-gray-800">${e.title}</span>
          <div class="flex items-center gap-2">
            <span class="font-bold text-[#7aa2ce]">฿ ${e.amount.toLocaleString()}</span>
            <button onclick="removeExpense(${index})" class="text-gray-300 hover:text-red-500 font-bold px-1">✕</button>
          </div>
        </div>
      `).join('');
    }

    function addExpense() {
      const titleInput = document.getElementById('exp-title');
      const amountInput = document.getElementById('exp-amount');

      const title = titleInput.value.trim();
      const amount = parseFloat(amountInput.value);

      if (title && amount) {
        expenses.push({ id: Date.now(), title, amount });
        titleInput.value = '';
        amountInput.value = '';
        renderExpenses();
      }
    }

    function removeExpense(index) {
      expenses.splice(index, 1);
      renderExpenses();
    }

    // --- Tab 3 Checklist & Documents Logic ---
    function renderChecklist() {
      const container = document.getElementById('checklist-container');
      container.innerHTML = checklist.map((item, index) => `
        <div class="flex items-center justify-between bg-gray-50 p-2.5 rounded-xl border border-gray-100">
          <label class="flex items-center gap-2.5 text-xs text-gray-700 cursor-pointer flex-1">
            <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleCheck(${index})" class="w-4 h-4 accent-[#7aa2ce] rounded">
            <span class="${item.done ? 'line-through text-gray-400' : 'font-medium'}">${item.text}</span>
          </label>
          <button onclick="removeChecklistItem(${index})" class="text-gray-300 hover:text-red-500 font-bold px-2 text-xs">✕</button>
        </div>
      `).join('');
    }

    function toggleCheck(index) {
      checklist[index].done = !checklist[index].done;
      renderChecklist();
    }

    function addChecklistItem() {
      const input = document.getElementById('new-check-item');
      const text = input.value.trim();
      if (text) {
        checklist.push({ id: Date.now(), text, done: false });
        input.value = '';
        renderChecklist();
      }
    }

    function removeChecklistItem(index) {
      checklist.splice(index, 1);
      renderChecklist();
    }

    function renderDocuments() {
      const grid = document.getElementById('doc-grid');
      grid.innerHTML = documents.map((doc, index) => `
        <div onclick="openDocModal(${index})" class="relative bg-gray-50 border border-gray-200 p-2 rounded-xl flex flex-col items-center justify-center cursor-pointer hover:border-[#7aa2ce] transition group">
          <button onclick="event.stopPropagation(); removeDocument(${index})" class="absolute top-1 right-1 bg-white/80 hover:bg-red-500 hover:text-white text-gray-400 text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold transition z-10">✕</button>
          ${doc.src 
            ? `<img src="${doc.src}" class="h-16 w-full object-cover rounded-lg mb-1 pointer-events-none">`
            : `<span class="text-2xl my-2">${doc.icon}</span>`
          }
          <span class="text-[10px] text-gray-600 font-medium truncate w-full text-center px-1">${doc.name}</span>
        </div>
      `).join('');
    }

    function uploadDoc(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          documents.push({ id: Date.now(), name: file.name, icon: '📄', src: evt.target.result });
          renderDocuments();
        };
        reader.readAsDataURL(file);
      }
    }

    function removeDocument(index) {
      documents.splice(index, 1);
      renderDocuments();
    }

    // 🖼️ Pop-up Modal Controls
    function openDocModal(index) {
      const doc = documents[index];
      if (!doc || !doc.src) {
        alert("ยังไม่มีไฟล์รูปภาพสำหรับเอกสารนี้ครับ สามารถอัปโหลดใหม่ได้เลย ✨");
        return;
      }
      
      const modal = document.getElementById('doc-modal');
      const img = document.getElementById('modal-img');
      const filename = document.getElementById('modal-filename');

      img.src = doc.src;
      filename.innerText = doc.name;
      modal.classList.remove('hidden');
    }

    function closeDocModal() {
      document.getElementById('doc-modal').classList.add('hidden');
    }

    function exportToImage() {
      const container = document.getElementById('app-container');
      html2canvas(container, { scale: 2, backgroundColor: "#b6e1f4" }).then(canvas => {
        let a = document.createElement('a');
        a.download = 'my-trip-planner.png';
        a.href = canvas.toDataURL();
        a.click();
      });
    }

    // Init
    document.getElementById('start-date-picker').value = startDate;
    updateHeaderDateRange();

    renderDays();
    renderItinerary();
    renderExpenses();
    renderChecklist();
    renderDocuments();
  </script>
</body>
</html>
