<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Planner ✈️🌸</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #cbd5e1; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
      cursor: pointer;
    }
  </style>
</head>
<body class="flex justify-center min-h-screen">

  <div id="app-container" class="w-full max-w-md bg-[#b6e1f4] min-h-screen shadow-2xl flex flex-col relative pb-24">
    
    <!-- ✈️ Header -->
    <div class="bg-[#7aa2ce] text-white p-6 rounded-b-[2.5rem] shadow-md z-10">
      <div class="flex justify-between items-start">
        <div class="flex-1 pr-2">
          <span class="bg-[#9abde1] text-white text-[11px] px-3 py-1 rounded-full font-medium shadow-sm">
            Travel guide ☘️
          </span>
          
          <h1 id="trip-title-display" contenteditable="true" onblur="saveCurrentTripTitle(this.innerText)" class="text-2xl font-bold mt-2 tracking-wide outline-none hover:bg-white/10 focus:bg-white/20 rounded-lg px-1 transition cursor-pointer" title="กดเพื่อแก้ไขชื่อทริป">
            Shanghai 2026 🌸
          </h1>
          
          <div class="mt-2 space-y-1">
            <div class="flex items-center gap-1.5">
              <span class="text-xs text-white/90 font-medium">📅 เริ่มวันแรก:</span>
              <input type="date" id="start-date-picker" onchange="onStartDateChange(this.value)" class="bg-white/20 text-white text-xs font-bold rounded-lg px-2 py-1 border border-white/30 outline-none cursor-pointer hover:bg-white/30 transition">
            </div>
            <p id="date-range-display" class="text-[11px] text-white/90 font-medium pl-1"></p>
          </div>
        </div>

        <!-- 🔑 Room Code & ปุ่ม Add/Switch Trip -->
        <div class="flex flex-col items-end gap-1.5 shrink-0">
          <div onclick="copyRoomCode()" class="bg-white/20 backdrop-blur-sm px-3 py-1.5 rounded-xl text-center border border-white/30 cursor-pointer hover:bg-white/30 active:scale-95 transition shadow-sm w-full" title="กดเพื่อคัดลอกรหัสห้อง">
            <p class="text-[8px] text-white/90 tracking-wider">ROOM CODE 🔑</p>
            <p class="font-mono text-xs font-bold text-[#fceb9e]" id="room-code-text">SHA01</p>
          </div>
          
          <button onclick="openTripModal()" class="bg-[#fceb9e] hover:bg-[#f5e69e] text-gray-800 text-[10px] font-bold px-2.5 py-1 rounded-xl shadow-sm active:scale-95 transition flex items-center gap-1">
            <span>➕</span> สลับ/เพิ่มทริป
          </button>
        </div>
      </div>
    </div>

    <!-- 🏷️ Navigation Tabs -->
    <div class="flex bg-white mx-4 mt-[-18px] pt-5 pb-2 px-2 rounded-2xl shadow-sm z-0 text-sm font-medium">
      <button onclick="switchTab(1)" id="tab-btn-1" class="flex-1 py-2 text-[#7aa2ce] border-b-2 border-[#7aa2ce] font-bold transition-all">
        📍 แผนเที่ยว
      </button>
      <button onclick="switchTab(2)" id="tab-btn-2" class="flex-1 py-2 text-gray-400 hover:text-[#7aa2ce] transition-all">
        💸 ค่าใช้จ่าย
      </button>
      <button onclick="switchTab(3)" id="tab-btn-3" class="flex-1 py-2 text-gray-400 hover:text-[#7aa2ce] transition-all">
        📁 เอกสาร
      </button>
    </div>

    <!-- TAB 1: Itinerary -->
    <div id="tab-1" class="flex-1 overflow-y-auto px-4 py-4 space-y-4">
      <div class="flex gap-2 overflow-x-auto scrollbar-hide items-center py-1" id="day-buttons"></div>
      <div class="space-y-3" id="itinerary-list"></div>
      <button onclick="addTimeSlot()" class="w-full py-3 bg-[#fceb9e] text-gray-800 font-bold text-sm rounded-2xl shadow-sm hover:bg-[#f5e69e] active:scale-95 transition-all flex justify-center items-center gap-2">
        ➕ เพิ่มเวลา / สถานที่
      </button>
    </div>

    <!-- TAB 2: Expenses -->
    <div id="tab-2" class="hidden flex-1 overflow-y-auto px-4 py-4 space-y-4">
      <div class="bg-white p-4 rounded-2xl shadow-sm space-y-3">
        <div class="flex items-center justify-between bg-gray-50 p-2.5 rounded-xl border border-gray-100">
          <span class="text-xs font-bold text-gray-700">👥 จำนวนผู้เดินทาง:</span>
          <div class="flex items-center gap-2">
            <input type="number" id="traveler-count" value="3" min="1" onchange="updateTravelerCount(this.value)" oninput="updateTravelerCount(this.value)" class="w-16 p-1.5 bg-white border border-gray-200 text-center font-bold text-xs rounded-lg outline-none text-[#7aa2ce] focus:border-[#7aa2ce]">
            <span class="text-xs text-gray-500 font-medium">คน</span>
          </div>
        </div>

        <div class="pt-2 border-t border-gray-100 grid grid-cols-2 gap-2">
          <div class="bg-[#b6e1f4]/30 p-3 rounded-xl text-center">
            <p class="text-[10px] text-gray-500 font-semibold">ยอดรวมทั้งหมด 💰</p>
            <h2 class="text-lg font-bold text-[#7aa2ce] mt-0.5" id="total-expense">฿ 0</h2>
          </div>
          <div class="bg-[#fceb9e]/50 p-3 rounded-xl text-center">
            <p class="text-[10px] text-gray-600 font-semibold">เฉลี่ยคนละ 🙋‍♂️</p>
            <h2 class="text-lg font-bold text-gray-800 mt-0.5" id="per-person-expense">฿ 0</h2>
          </div>
        </div>
      </div>

      <div class="bg-white p-4 rounded-2xl shadow-sm space-y-3">
        <h3 class="font-bold text-gray-700 text-sm">บันทึกค่าใช้จ่ายใหม่ 📝</h3>
        <input type="text" id="exp-title" placeholder="รายการ (เช่น ค่าโรงแรม, ค่าซูชิ)" class="w-full p-2.5 bg-gray-50 border border-gray-200 text-xs rounded-xl outline-none focus:border-[#7aa2ce]">
        <input type="number" id="exp-amount" placeholder="จำนวนเงิน (บาท)" class="w-full p-2.5 bg-gray-50 border border-gray-200 text-xs rounded-xl outline-none focus:border-[#7aa2ce]">
        
        <button onclick="addExpense()" class="w-full py-2.5 bg-[#7aa2ce] text-white font-bold text-xs rounded-xl shadow-sm hover:bg-[#6894c2] active:scale-95 transition-all">
          + บันทึกรายการ
        </button>
      </div>

      <div class="space-y-2" id="expense-items-list"></div>
    </div>

    <!-- TAB 3: Checklist & Documents -->
    <div id="tab-3" class="hidden flex-1 overflow-y-auto px-4 py-4 space-y-4">
      <div class="bg-white p-4 rounded-2xl shadow-sm">
        <h3 class="font-bold text-gray-700 text-sm mb-3">สิ่งของที่ต้องเตรียม 🎒</h3>
        <div class="space-y-2" id="checklist-container"></div>
        <div class="flex gap-2 mt-4 pt-3 border-t border-gray-100">
          <input type="text" id="new-check-item" placeholder="เพิ่มรายการสิ่งของ..." class="flex-1 p-2.5 bg-gray-50 border border-gray-200 text-xs rounded-xl outline-none focus:border-[#7aa2ce]">
          <button onclick="addChecklistItem()" class="px-4 py-2.5 bg-[#7aa2ce] text-white font-bold text-xs rounded-xl hover:bg-[#6894c2] active:scale-95 transition-all">
            + เพิ่ม
          </button>
        </div>
      </div>

      <div class="bg-white p-4 rounded-2xl shadow-sm">
        <div class="flex justify-between items-center mb-3">
          <h3 class="font-bold text-gray-700 text-sm">คลังเอกสารสำคัญ 📎</h3>
          <label class="text-xs bg-[#7aa2ce] text-white px-3 py-1.5 rounded-xl font-bold cursor-pointer hover:bg-[#6894c2] transition">
            + อัปโหลด
            <input type="file" accept="image/*" class="hidden" onchange="uploadDoc(event)">
          </label>
        </div>
        <div class="grid grid-cols-2 gap-3" id="doc-grid"></div>
      </div>
    </div>

    <!-- Room Code Modal -->
    <div id="trip-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm" onclick="closeTripModal()">
      <div class="bg-white rounded-3xl p-5 w-full max-w-sm shadow-2xl space-y-4" onclick="event.stopPropagation()">
        <div class="flex justify-between items-center border-b pb-3">
          <h3 class="font-bold text-gray-800 text-base flex items-center gap-2">🔑 สลับทริป / สร้างทริปใหม่</h3>
          <button onclick="closeTripModal()" class="text-gray-400 hover:text-gray-600 font-bold text-sm">✕</button>
        </div>

        <div class="space-y-3">
          <div>
            <label class="block text-xs font-bold text-gray-600 mb-1">ใส่ Room Code (ตัวอักษร/ตัวเลข 5 หลัก):</label>
            <input type="text" id="modal-room-input" maxlength="5" placeholder="เช่น SHA01, JPN26" class="w-full p-2.5 bg-gray-50 border border-gray-200 text-sm font-mono font-bold text-center tracking-widest text-[#7aa2ce] rounded-xl outline-none focus:border-[#7aa2ce] uppercase">
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-600 mb-1">ชื่อทริป (กรณีสร้างทริปใหม่):</label>
            <input type="text" id="modal-title-input" placeholder="เช่น Shanghai Trip 2026 🌸" class="w-full p-2.5 bg-gray-50 border border-gray-200 text-xs rounded-xl outline-none focus:border-[#7aa2ce]">
          </div>

          <button onclick="handleTripSubmit()" class="w-full py-3 bg-[#7aa2ce] text-white font-bold text-xs rounded-xl shadow-md hover:bg-[#6894c2] active:scale-95 transition-all">
            เข้าสู่ทริป / สร้างทริปใหม่ 🚀
          </button>
        </div>
      </div>
    </div>

    <!-- Document Modal View -->
    <div id="doc-modal" class="fixed inset-0 bg-black/80 z-50 hidden flex flex-col items-center justify-center p-4 backdrop-blur-sm" onclick="closeDocModal()">
      <div class="relative max-w-full max-h-[85vh] flex flex-col items-center" onclick="event.stopPropagation()">
        <button onclick="closeDocModal()" class="absolute -top-12 right-0 text-white font-bold text-lg bg-white/20 hover:bg-white/40 w-9 h-9 rounded-full flex items-center justify-center transition">✕</button>
        <img id="modal-img" src="" class="max-w-full max-h-[70vh] object-contain rounded-2xl shadow-2xl border-2 border-white/20">
        <p id="modal-filename" class="text-white text-xs font-semibold mt-3 bg-white/20 px-3 py-1 rounded-full backdrop-blur-md"></p>
        <p class="text-white/80 text-[11px] mt-2 bg-black/40 px-3 py-1 rounded-full">💡 กดค้างที่รูปภาพเพื่อบันทึกลงเครื่อง</p>
      </div>
    </div>

    <!-- Export Button -->
    <div class="fixed bottom-3 left-0 w-full px-6 flex justify-center z-20 pointer-events-none">
      <button onclick="exportToImage()" class="pointer-events-auto bg-[#7aa2ce] text-white shadow-xl px-6 py-3 rounded-full font-bold text-xs flex items-center gap-2 hover:scale-105 active:scale-95 transition-transform border-2 border-white">
        📸 แคปเจอร์หน้าจอนี้
      </button>
    </div>

  </div>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD-UwBsdoWOOuJn4GKc0Gbmc-Un51txT_s",
      authDomain: "travel-guide-252535.firebaseapp.com",
      databaseURL: "https://travel-guide-252535-default-rtdb.firebaseio.com",
      projectId: "travel-guide-252535",
      storageBucket: "travel-guide-252535.firebasestorage.app",
      messagingSenderId: "769845037504",
      appId: "1:769845037504:web:2cdf3cfba4b67e662da025"
    };

    let db = null;
    try {
      const app = initializeApp(firebaseConfig);
      db = getDatabase(app);
    } catch(e) {
      console.warn("Firebase Offline Mode");
    }

    const monthsEN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    
    let activeTab = 1;
    let currentRoomCode = localStorage.getItem('active_room_code') || "SHA01";
    let firebaseUnsubscribe = null;

    let allTripsLocal = JSON.parse(localStorage.getItem('my_travel_trips')) || {};

    function createBlankTrip(code, title) {
      const today = new Date().toISOString().split('T')[0];
      return {
        roomCode: code,
        title: title || `ทริป ${code} 🌸`,
        startDate: today,
        totalDays: 3,
        travelerCount: 2,
        activeDay: 1,
        itineraryData: { 1: [], 2: [], 3: [] },
        expenses: [],
        checklist: [
          { id: 1, text: 'หนังสือเดินทาง (Passport) 🛂', done: false }
        ],
        documents: []
      };
    }

    // กำหนดค่าเริ่มต้นทริปแรก
    if (!allTripsLocal["SHA01"]) {
      allTripsLocal["SHA01"] = {
        roomCode: "SHA01",
        title: "Shanghai 2026 🌸",
        startDate: "2026-12-03",
        totalDays: 4,
        travelerCount: 3,
        activeDay: 1,
        itineraryData: { 
          1: [
            { id: 1, time: '09:00', detail: 'ทานอาหารเช้าที่ร้านข้าวแกงแนวโรงอาหาร หลังถนน Nanjing' },
            { id: 2, time: '11:00', detail: 'check-in โรงแรม พักผ่อน' },
            { id: 3, time: '14:00', detail: 'West nanjing' }
          ],
          2: [], 3: [], 4: [] 
        },
        expenses: [],
        checklist: [
          { id: 1, text: 'หนังสือเดินทาง (Passport) 🛂', done: true },
          { id: 2, text: 'แลกเงิน 💴', done: true }
        ],
        documents: []
      };
    }

    let currentTripData = allTripsLocal[currentRoomCode] || createBlankTrip(currentRoomCode, "");

    function saveState() {
      allTripsLocal[currentRoomCode] = currentTripData;
      localStorage.setItem('my_travel_trips', JSON.stringify(allTripsLocal));
      localStorage.setItem('active_room_code', currentRoomCode);
      
      if (db) {
        try { set(ref(db, 'trips/' + currentRoomCode), currentTripData); } catch(e){}
      }
    }

    function loadAndSyncTrip(roomCode, optionalTitle = "") {
      currentRoomCode = roomCode;
      localStorage.setItem('active_room_code', currentRoomCode);

      // 1. ยกเลิก Listener ตัวเก่า
      if (typeof firebaseUnsubscribe === 'function') {
        firebaseUnsubscribe();
        firebaseUnsubscribe = null;
      }

      // 2. เรนเดอร์หน้าจอทันที (Synchronous Render) เพื่อไม่ให้ติดค้าง
      if (!allTripsLocal[roomCode]) {
        allTripsLocal[roomCode] = createBlankTrip(roomCode, optionalTitle);
      } else if (optionalTitle) {
        allTripsLocal[roomCode].title = optionalTitle;
      }
      
      currentTripData = allTripsLocal[roomCode];
      saveState();
      renderAllUI(); // แสดงผลทันที!

      // 3. ดึงและซิงค์ Firebase ในเบื้องหลัง
      if (db) {
        try {
          const tripRef = ref(db, 'trips/' + roomCode);
          firebaseUnsubscribe = onValue(tripRef, (snapshot) => {
            const data = snapshot.val();
            if (data && data.roomCode === roomCode) {
              currentTripData = data;
              allTripsLocal[roomCode] = data;
              localStorage.setItem('my_travel_trips', JSON.stringify(allTripsLocal));
              renderAllUI();
            } else if (!data) {
              set(ref(db, 'trips/' + roomCode), currentTripData);
            }
          }, (err) => console.log("Firebase sync notice:", err));
        } catch(e) {
          console.log("Firebase error:", e);
        }
      }
    }

    // --- Actions ---
    window.handleTripSubmit = function() {
      const codeInput = document.getElementById('modal-room-input').value.trim().toUpperCase();
      const titleInput = document.getElementById('modal-title-input').value.trim();

      if (codeInput.length !== 5) {
        alert("กรุณากรอก Room Code ให้ครบ 5 หลักครับ!");
        return;
      }

      closeTripModal();
      loadAndSyncTrip(codeInput, titleInput);
    };

    window.openTripModal = function() {
      document.getElementById('modal-room-input').value = '';
      document.getElementById('modal-title-input').value = '';
      document.getElementById('trip-modal').classList.remove('hidden');
    };

    window.closeTripModal = function() {
      document.getElementById('trip-modal').classList.add('hidden');
    };

    window.onStartDateChange = function(val) {
      currentTripData.startDate = val;
      saveState();
      renderAllUI();
    };

    window.saveCurrentTripTitle = function(newTitle) {
      currentTripData.title = newTitle.trim() || "ทริปของฉัน 🌸";
      saveState();
    };

    window.copyRoomCode = function() {
      navigator.clipboard.writeText(currentRoomCode).then(() => {
        alert(`คัดลอกรหัสห้อง [ ${currentRoomCode} ] เรียบร้อยแล้ว! 🔑`);
      });
    };

    window.switchTab = function(id) {
      activeTab = id;
      [1, 2, 3].forEach(i => {
        document.getElementById(`tab-${i}`).classList.add('hidden');
        document.getElementById(`tab-btn-${i}`).className = "flex-1 py-2 text-gray-400 hover:text-[#7aa2ce] transition-all";
      });
      document.getElementById(`tab-${id}`).classList.remove('hidden');
      document.getElementById(`tab-btn-${id}`).className = "flex-1 py-2 text-[#7aa2ce] border-b-2 border-[#7aa2ce] font-bold transition-all";
    };

    // --- Helpers & Renders ---
    function getDateForDay(dayIndex) {
      if (!currentTripData.startDate) return '';
      const d = new Date(currentTripData.startDate);
      d.setDate(d.getDate() + (dayIndex - 1));
      return `${d.getDate()} ${monthsEN[d.getMonth()]}`;
    }

    function updateHeaderDateRange() {
      if (!currentTripData.startDate) return;
      const start = new Date(currentTripData.startDate);
      const end = new Date(currentTripData.startDate);
      const totalDays = currentTripData.totalDays || 1;
      end.setDate(end.getDate() + (totalDays - 1));

      const startStr = `${start.getDate()} ${monthsEN[start.getMonth()]}`;
      const endStr = `${end.getDate()} ${monthsEN[end.getMonth()]} ${end.getFullYear()}`;
      
      document.getElementById('date-range-display').innerText = `🗓️ ${startStr} - ${endStr} (${totalDays} วัน)`;
      document.getElementById('start-date-picker').value = currentTripData.startDate;
    }

    function renderDays() {
      const dayBox = document.getElementById('day-buttons');
      let html = '';
      const totalDays = currentTripData.totalDays || 1;
      const activeDay = currentTripData.activeDay || 1;

      for (let day = 1; day <= totalDays; day++) {
        const isActive = day === activeDay;
        const dayDateStr = getDateForDay(day);
        html += `
          <button onclick="changeDay(${day})" class="min-w-[80px] py-2 rounded-2xl text-xs font-bold transition-all flex flex-col items-center justify-center ${
            isActive ? 'bg-[#fceb9e] text-gray-800 shadow-sm' : 'bg-[#9abde1] text-white opacity-80 hover:opacity-100'
          }">
            <span>Day ${day} 🌸</span>
            <span class="text-[10px] font-normal ${isActive ? 'text-gray-700' : 'text-white/90'}">${dayDateStr}</span>
          </button>
        `;
      }
      html += `
        <button onclick="addNewDay()" class="min-w-[35px] h-[35px] rounded-full bg-white text-[#7aa2ce] font-bold text-sm shadow-sm hover:bg-gray-50 flex items-center justify-center shrink-0">
          +
        </button>
      `;
      dayBox.innerHTML = html;
    }

    window.changeDay = function(day) {
      currentTripData.activeDay = day;
      saveState();
      renderAllUI();
    };

    window.addNewDay = function() {
      currentTripData.totalDays = (currentTripData.totalDays || 0) + 1;
      if (!currentTripData.itineraryData) currentTripData.itineraryData = {};
      currentTripData.itineraryData[currentTripData.totalDays] = [];
      currentTripData.activeDay = currentTripData.totalDays;
      saveState();
      renderAllUI();
    };

    function renderItinerary() {
      const itemList = document.getElementById('itinerary-list');
      const activeDay = currentTripData.activeDay || 1;
      const items = (currentTripData.itineraryData && currentTripData.itineraryData[activeDay]) || [];
      
      if (items.length === 0) {
        itemList.innerHTML = `<div class="text-center py-8 text-xs text-gray-500 bg-white/50 rounded-2xl">ยังไม่มีแผนสำหรับวันนี้ กดปุ่มด้านล่างเพื่อเพิ่มได้เลย ✨</div>`;
        return;
      }
      itemList.innerHTML = items.map((item, index) => `
        <div class="flex items-start gap-2 bg-white p-3 rounded-2xl shadow-sm border-l-4 border-[#7aa2ce]">
          <input type="time" value="${item.time}" onchange="updateTimeSlot(${index}, 'time', this.value)" class="bg-gray-50 border border-gray-200 text-[#7aa2ce] font-bold text-xs rounded-xl p-2 outline-none w-20 text-center">
          <textarea rows="2" onchange="updateTimeSlot(${index}, 'detail', this.value)" class="w-full bg-transparent text-xs text-gray-700 outline-none resize-none pt-1" placeholder="พิมพ์กิจกรรม...">${item.detail}</textarea>
          <button onclick="removeTimeSlot(${index})" class="text-gray-300 hover:text-red-500 font-bold px-1 text-xs pt-1">✕</button>
        </div>
      `).join('');
    }

    window.addTimeSlot = function() {
      const activeDay = currentTripData.activeDay || 1;
      if (!currentTripData.itineraryData) currentTripData.itineraryData = {};
      if (!currentTripData.itineraryData[activeDay]) currentTripData.itineraryData[activeDay] = [];
      currentTripData.itineraryData[activeDay].push({ id: Date.now(), time: '12:00', detail: '' });
      saveState();
      renderAllUI();
    };

    window.updateTimeSlot = function(index, field, value) {
      const activeDay = currentTripData.activeDay || 1;
      if (currentTripData.itineraryData[activeDay][index]) {
        currentTripData.itineraryData[activeDay][index][field] = value;
        saveState();
      }
    };

    window.removeTimeSlot = function(index) {
      const activeDay = currentTripData.activeDay || 1;
      currentTripData.itineraryData[activeDay].splice(index, 1);
      saveState();
      renderAllUI();
    };

    // Expenses
    window.updateTravelerCount = function(val) {
      currentTripData.travelerCount = parseInt(val) || 1;
      saveState();
      renderExpenses();
    };

    function renderExpenses() {
      const list = document.getElementById('expense-items-list');
      document.getElementById('traveler-count').value = currentTripData.travelerCount || 1;

      let total = 0;
      const expensesList = currentTripData.expenses || [];
      expensesList.forEach(e => total += e.amount);

      const count = currentTripData.travelerCount || 1;
      const perPerson = total / count;

      document.getElementById('total-expense').innerText = `฿ ${total.toLocaleString()}`;
      document.getElementById('per-person-expense').innerText = `฿ ${Math.round(perPerson).toLocaleString()}`;

      list.innerHTML = expensesList.map((e, index) => `
        <div class="bg-white p-3 rounded-2xl shadow-sm flex justify-between items-center text-xs">
          <span class="font-bold text-gray-800">${e.title}</span>
          <div class="flex items-center gap-2">
            <span class="font-bold text-[#7aa2ce]">฿ ${e.amount.toLocaleString()}</span>
            <button onclick="removeExpense(${index})" class="text-gray-300 hover:text-red-500 font-bold px-1">✕</button>
          </div>
        </div>
      `).join('');
    }

    window.addExpense = function() {
      const titleInput = document.getElementById('exp-title');
      const amountInput = document.getElementById('exp-amount');
      const title = titleInput.value.trim();
      const amount = parseFloat(amountInput.value);

      if (title && amount) {
        if (!currentTripData.expenses) currentTripData.expenses = [];
        currentTripData.expenses.push({ id: Date.now(), title, amount });
        titleInput.value = '';
        amountInput.value = '';
        saveState();
        renderExpenses();
      }
    };

    window.removeExpense = function(index) {
      currentTripData.expenses.splice(index, 1);
      saveState();
      renderExpenses();
    };

    // Checklist & Docs
    function renderChecklist() {
      const container = document.getElementById('checklist-container');
      const items = currentTripData.checklist || [];
      container.innerHTML = items.map((item, index) => `
        <div class="flex items-center justify-between bg-gray-50 p-2.5 rounded-xl border border-gray-100">
          <label class="flex items-center gap-2.5 text-xs text-gray-700 cursor-pointer flex-1">
            <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleCheck(${index})" class="w-4 h-4 accent-[#7aa2ce] rounded">
            <span class="${item.done ? 'line-through text-gray-400' : 'font-medium'}">${item.text}</span>
          </label>
          <button onclick="removeChecklistItem(${index})" class="text-gray-300 hover:text-red-500 font-bold px-2 text-xs">✕</button>
        </div>
      `).join('');
    }

    window.toggleCheck = function(index) {
      currentTripData.checklist[index].done = !currentTripData.checklist[index].done;
      saveState();
      renderChecklist();
    };

    window.addChecklistItem = function() {
      const input = document.getElementById('new-check-item');
      const text = input.value.trim();
      if (text) {
        if (!currentTripData.checklist) currentTripData.checklist = [];
        currentTripData.checklist.push({ id: Date.now(), text, done: false });
        input.value = '';
        saveState();
        renderChecklist();
      }
    };

    window.removeChecklistItem = function(index) {
      currentTripData.checklist.splice(index, 1);
      saveState();
      renderChecklist();
    };

    function renderDocuments() {
      const grid = document.getElementById('doc-grid');
      const docs = currentTripData.documents || [];
      grid.innerHTML = docs.map((doc, index) => `
        <div onclick="openDocModal(${index})" class="relative bg-gray-50 border border-gray-200 p-2 rounded-xl flex flex-col items-center justify-center cursor-pointer hover:border-[#7aa2ce] transition group">
          <button onclick="event.stopPropagation(); removeDocument(${index})" class="absolute top-1 right-1 bg-white/80 hover:bg-red-500 hover:text-white text-gray-400 text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold transition z-10">✕</button>
          ${doc.src 
            ? `<img src="${doc.src}" class="h-16 w-full object-cover rounded-lg mb-1 pointer-events-none">`
            : `<span class="text-2xl my-2">${doc.icon}</span>`
          }
          <span class="text-[10px] text-gray-600 font-medium truncate w-full text-center px-1">${doc.name}</span>
        </div>
      `).join('');
    }

    window.uploadDoc = function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          if (!currentTripData.documents) currentTripData.documents = [];
          currentTripData.documents.push({ id: Date.now(), name: file.name, icon: '📄', src: evt.target.result });
          saveState();
          renderDocuments();
        };
        reader.readAsDataURL(file);
      }
    };

    window.removeDocument = function(index) {
      currentTripData.documents.splice(index, 1);
      saveState();
      renderDocuments();
    };

    window.openDocModal = function(index) {
      const doc = currentTripData.documents[index];
      if (!doc || !doc.src) {
        alert("ยังไม่มีไฟล์รูปภาพสำหรับเอกสารนี้ครับ สามารถอัปโหลดใหม่ได้เลย ✨");
        return;
      }
      document.getElementById('modal-img').src = doc.src;
      document.getElementById('modal-filename').innerText = doc.name;
      document.getElementById('doc-modal').classList.remove('hidden');
    };

    window.closeDocModal = function() {
      document.getElementById('doc-modal').classList.add('hidden');
    };

    window.exportToImage = function() {
      const container = document.getElementById('app-container');
      html2canvas(container, { scale: 2, backgroundColor: "#b6e1f4" }).then(canvas => {
        let a = document.createElement('a');
        a.download = `${currentRoomCode}-trip-plan.png`;
        a.href = canvas.toDataURL();
        a.click();
      });
    };

    function renderAllUI() {
      document.getElementById('trip-title-display').innerText = currentTripData.title || `ทริป ${currentRoomCode} 🌸`;
      document.getElementById('room-code-text').innerText = currentRoomCode;
      
      updateHeaderDateRange();
      renderDays();
      renderItinerary();
      renderExpenses();
      renderChecklist();
      renderDocuments();
    }

    // เริ่มต้นระบบ
    loadAndSyncTrip(currentRoomCode);
  </script>
</body>
</html>
